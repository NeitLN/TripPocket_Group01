name: CI

# Unit tests, lint and a debug build on every pull request into develop or main.
# No google-services.json here: the app builds and tests without it (see docs/RUNBOOK.md).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
