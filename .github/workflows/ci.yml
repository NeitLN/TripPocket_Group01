name: CI

# Unit tests (with coverage), lint and a debug + release build on every pull request into
# develop or main. No google-services.json and no keystore here: the app builds and tests
# without them, and the release APK comes out unsigned (see docs/RUNBOOK.md).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads its Android jars from Maven Central on first use, outside Gradle's
      # cache. A hiccup there failed every Robolectric class twice (FileNotFoundException), so
      # the jars are cached between runs, keyed on the version catalog (Robolectric's version).
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - name: Test with coverage, lint, build
        run: ./gradlew createDebugUnitTestCoverageReport lintDebug assembleDebug --console=plain
      # The release build runs R8 and resource shrinking, which a debug build never does: a
      # missing keep rule shows up here instead of on the phone.
      - name: Release build and lint
        run: ./gradlew assembleRelease lintRelease --console=plain
      - name: Coverage summary
        if: always()
        run: |
          xml=app/build/reports/coverage/test/debug/report.xml
          [ -f "$xml" ] || exit 0
          python3 - "$xml" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("### Unit test coverage (JaCoCo)\n\n| Counter | Covered | Total | % |\n|---|---|---|---|")
          for c in root.findall("counter"):
              missed, covered = int(c.get("missed")), int(c.get("covered"))
              total = missed + covered
              print(f"| {c.get('type').title()} | {covered} | {total} | {100 * covered / total:.1f} |")
          PY
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/build/reports/coverage/test/debug
          if-no-files-found: ignore
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports

  # A5: firestore.rules with two accounts, in the Firestore emulator (firestore-tests/README.md).
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - run: npm ci
      - run: npm test

  # A3: Espresso tests (app/src/androidTest) on an emulator. Without google-services.json the
  # debug app signs in as the offline stand-in that owns the sample trips, so no Firebase is
  # needed. The Orchestrator clears the app data before every test.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A phone-sized screen; the runner's default AVD is much smaller than any real phone.
          profile: pixel_6
          disable-animations: true
          # Usual CI options: no window, software GPU, no camera or audio; boot from scratch.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # About half the runs had every Espresso test fail with RootViewWithoutFocusException:
          # something else held the focus (a system dialog or the lock screen right after boot).
          # Unlock and close system dialogs first; on a failure, keep a screenshot and the focused
          # window, so the report shows what was in the way.
          script: |
            adb shell input keyevent 82
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            ./gradlew connectedDebugAndroidTest --console=plain || { mkdir -p app/build/reports/androidTests; adb exec-out screencap -p > app/build/reports/androidTests/failure-screen.png; adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > app/build/reports/androidTests/focus.txt; exit 1; }
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
